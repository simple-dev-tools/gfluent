[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gfluent"
version = "1.2.1"
description = "A lightweight wrapper for GCS and BigQuery client library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["google", "cloud", "bigquery", "gcs"]
authors = [{ name = "Zhong Dai", email = "zhongdai.au@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "google-api-python-client>=2.196.0",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-storage>=3.10.1",
]

[project.urls]
Homepage = "https://github.com/simple-dev-tools/gfluent"

[dependency-groups]
dev = [
    "bump2version==1.0.1",
    "wheel==0.47.0",
    "watchdog==6.0.0",
    "flake8==7.3.0",
    "coverage==7.14.0",
    "Sphinx==7.4.7",
    "twine==6.2.0",
    "pytest==9.0.3",
    "black==26.3.1",
    "pre-commit==4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gfluent"]

[tool.hatch.build.targets.sdist]
include = ["gfluent", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
markers = [
    "integtest: marks test cases for integration test",
]

[tool.flake8]
max-line-length = 100
